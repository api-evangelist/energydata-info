aid: energydata-info
name: ENERGYDATA.info
description: >-
  ENERGYDATA.info is a organization open-data portal running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 1,190 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
